name: cohortz
description: "Privacy-first local-first Flutter app for small groups."
repository: https://github.com/wfinken/cohrtz_app
homepage: https://github.com/wfinken/cohrtz_app
issue_tracker: https://github.com/wfinken/cohrtz_app/issues
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.4.8
  protobuf: ^3.1.0
  fixnum: ^1.1.0
  crypto: ^3.0.3
  flutter_riverpod: ^3.1.0
  uuid: ^4.4.0
  cryptography: ^2.9.0
  path_provider: ^2.1.5
  sqlite3: ^2.9.4
  sql_crdt: ^3.0.3
  drift: ^2.28.2
  drift_crdt: ^1.0.11
  sqlite3_flutter_libs: ^0.5.41
  http: ^1.6.0
  path: ^1.9.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  google_fonts: ^6.1.0
  table_calendar: ^3.1.0
  flutter_local_notifications: ^18.0.1
  # Security packages
  flutter_dashboard_grid:
    git: 
      url: https://github.com/wfinken/flutter_dashboard_grid
  dart_mappable: ^4.2.0
  flutter_background_service: ^5.0.0
  crop_your_image: ^1.1.0
  file_picker: ^8.1.4
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  dart_mappable_builder: ^4.2.0
  drift_dev: ^2.28.3
  sqflite_common_ffi: ^2.3.7+1
  sqlite_crdt: ^3.0.4

flutter:
  uses-material-design: true
